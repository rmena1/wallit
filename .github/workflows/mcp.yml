name: MCP verification
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wallit_mcp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/wallit_mcp_test
      MCP_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:55432/wallit_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config mcp.playwright.config.ts
      - run: npm run build
